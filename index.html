<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحارب المخضرم</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma, Arial;
}

body{
background:#0a0f1c;
color:white;
}

/* HERO BACKGROUND SOLDIER */
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
padding:20px;

background:
linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.85)),
url('https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
}

.hero-content{
z-index:2;
}

.title{
font-size:55px;
font-weight:bold;
margin-bottom:10px;
letter-spacing:1px;
}

.subtitle{
font-size:18px;
opacity:0.85;
margin-bottom:25px;
}

/* BUTTONS */
.btn{
display:inline-block;
margin:8px;
padding:14px 26px;
border-radius:12px;
border:none;
cursor:pointer;
font-size:16px;
color:white;
background:linear-gradient(135deg,#ef4444,#b91c1c);
transition:0.3s;
box-shadow:0 5px 15px rgba(0,0,0,0.4);
text-decoration:none;
}

.btn:hover{
transform:scale(1.08);
background:linear-gradient(135deg,#ff4d4d,#7f1d1d);
}

/* SECTIONS */
.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.1);
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

/* FEATURES */
.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:15px;
}

.feature{
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:12px;
text-align:center;
}

/* FORM */
iframe{
width:100%;
height:850px;
border:none;
border-radius:12px;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
background:#050814;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

<div class="hero-content">

<div class="title">⚔️ المحارب المخضرم</div>
<div class="subtitle">منصة احترافية للتسجيل وإدارة الطلبات</div>

<a href="#register" class="btn">ابدأ التسجيل</a>
<a href="#info" class="btn">المعلومات</a>
<a href="#contact" class="btn">تواصل معنا</a>

</div>

</section>

<!-- CONTENT -->
<div class="container">

<div class="card" id="register">
<h2>استمارة التسجيل</h2>

<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe09873Fy1RAdO48UPyWjvMJ2R6r7mL8_NN7l3MK092sTnqvQ/viewform?embedded=true"></iframe>

</div>

<div class="card" id="info">
<h2>مميزات المنصة</h2>

<div class="features">
<div class="feature">تصميم احترافي</div>
<div class="feature">سرعة استجابة</div>
<div class="feature">متابعة الطلبات</div>
<div class="feature">نظام آمن</div>
</div>

</div>

</div>

<footer>
© 2026 المحارب المخضرم - جميع الحقوق محفوظة
</footer>

</body>
</html>

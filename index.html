<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ نظام المحارب المخضرم</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma, Arial;
}

body{
background:#050814;
color:white;
}

/* TOP BAR */
.topbar{
background:#0b1220;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
font-size:18px;
font-weight:bold;
}

.status{
color:#22c55e;
font-size:12px;
}

/* HERO */
.hero{
height:70vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;

background:
linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.9)),
url('https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&w=1600&q=80');

.title{
font-size:48px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:16px;
opacity:0.8;
margin-bottom:20px;
}

/* BUTTONS */
.btn{
display:inline-block;
margin:6px;
padding:12px 18px;
border-radius:10px;
border:none;
cursor:pointer;
font-size:14px;
color:white;
background:linear-gradient(135deg,#dc2626,#7f1d1d);
transition:0.3s;
text-decoration:none;
}

.btn:hover{
transform:scale(1.06);
}

/* DASHBOARD */
.container{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
border-radius:15px;
padding:20px;
}

.stat{
font-size:26px;
font-weight:bold;
color:#22c55e;
}

.label{
font-size:13px;
opacity:0.8;
margin-top:5px;
}

/* FORM */
iframe{
width:100%;
height:800px;
border:none;
border-radius:12px;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
background:#02030a;
margin-top:30px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div class="logo">⚔️ نظام المحارب المخضرم</div>
<div class="status">🟢 ONLINE</div>
</div>

<!-- HERO -->
<section class="hero">
<div>
<div class="title">نظام العمليات العسكري</div>
<div class="subtitle">إدارة التسجيلات والمتابعة بشكل احترافي</div>

<a href="#dashboard" class="btn">لوحة التحكم</a>
<a href="#register" class="btn">التسجيل</a>
<a href="https://t.me/ruuuseesuv" target="_blank" class="btn">تواصل معنا 📢</a>

</div>
</section>

<!-- DASHBOARD -->
<div class="container" id="dashboard">

<div class="grid">

<div class="card">
<div class="stat" id="users">0</div>
<div class="label">عدد المسجلين (تجريبي)</div>
</div>

<div class="card">
<div class="stat">ACTIVE</div>
<div class="label">حالة النظام</div>
</div>

<div class="card">
<div class="stat">SECURE</div>
<div class="label">الحماية</div>
</div>

<div class="card">
<div class="stat">FAST</div>
<div class="label">الأداء</div>
</div>

</div>

</div>

<!-- FORM -->
<div class="container" id="register">

<div class="card">
<h2>📋 استمارة التسجيل</h2>

<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe09873Fy1RAdO48UPyWjvMJ2R6r7mL8_NN7l3MK092sTnqvQ/viewform?embedded=true"></iframe>

</div>

</div>

<footer>
© 2026 نظام المحارب المخضرم
</footer>

<script>
// عدّاد تجريبي
let count = 0;
setInterval(()=>{
count++;
document.getElementById("users").innerText = count;
},3000);
</script>

</body>
</html>

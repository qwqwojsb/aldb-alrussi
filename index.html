<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ نظام المحارب المخضرم</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma, Arial;
}

/* VIDEO BACKGROUND */
#bg-video{
position:fixed;
right:0;
bottom:0;
min-width:100%;
min-height:100%;
object-fit:cover;
z-index:-2;
}

/* DARK OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
z-index:-1;
}

body{
color:white;
}

/* TOP BAR */
.topbar{
background:rgba(0,0,0,0.6);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
}

.logo{
font-size:18px;
font-weight:bold;
}

.status{
color:#22c55e;
font-size:12px;
}

/* HERO */
.hero{
height:70vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.title{
font-size:50px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:16px;
opacity:0.85;
margin-bottom:20px;
}

/* BUTTONS */
.btn{
display:inline-block;
margin:6px;
padding:12px 18px;
border-radius:10px;
border:none;
cursor:pointer;
font-size:14px;
color:white;
background:linear-gradient(135deg,#dc2626,#7f1d1d);
transition:0.3s;
text-decoration:none;
box-shadow:0 8px 20px rgba(0,0,0,0.5);
}

.btn:hover{
transform:scale(1.06);
background:linear-gradient(135deg,#ef4444,#991b1b);
}

/* CONTAINER */
.container{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
border-radius:15px;
padding:20px;
}

.stat{
font-size:26px;
font-weight:bold;
color:#22c55e;
}

.label{
font-size:13px;
opacity:0.8;
margin-top:5px;
}

/* FORM */
iframe{
width:100%;
height:800px;
border:none;
border-radius:12px;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
background:rgba(0,0,0,0.6);
margin-top:30px;
backdrop-filter:blur(10px);
}
</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video autoplay muted loop id="bg-video">
  <source src="https://cdn.coverr.co/videos/coverr-soldiers-walking-in-smoke-7577/1080p.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- TOP BAR -->
<div class="topbar">
<div class="logo">⚔️ نظام المحارب المخضرم</div>
<div class="status">🟢 ONLINE</div>
</div>

<!-- HERO -->
<section class="hero">
<div>
<div class="title">نظام العمليات العسكري</div>
<div class="subtitle">منصة تسجيل وإدارة احترافية</div>

<a href="#dashboard" class="btn">لوحة التحكم</a>
<a href="#register" class="btn">التسجيل</a>
<a href="https://t.me/ruuuseesuv" target="_blank" class="btn">تواصل معنا 📢</a>

</div>
</section>

<!-- DASHBOARD -->
<div class="container" id="dashboard">

<div class="grid">

<div class="card">
<div class="stat">LIVE</div>
<div class="label">حالة النظام</div>
</div>

<div class="card">
<div class="stat">SECURE</div>
<div class="label">الحماية</div>
</div>

<div class="card">
<div class="stat">FAST</div>
<div class="label">الأداء</div>
</div>

<div class="card">
<div class="stat">ACTIVE</div>
<div class="label">الخدمة</div>
</div>

</div>

</div>

<!-- FORM -->
<div class="container" id="register">

<div class="card">
<h2>📋 استمارة التسجيل</h2>

<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe09873Fy1RAdO48UPyWjvMJ2R6r7mL8_NN7l3MK092sTnqvQ/viewform?embedded=true"></iframe>

</div>

</div>

<!-- FOOTER -->
<footer>
© 2026 نظام المحارب المخضرم
</footer>

</body>
</html>

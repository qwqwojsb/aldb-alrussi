<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ المحارب المخضرم</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma, Arial;
}

body{
background:#050814;
color:#fff;
}

/* HERO */
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;

background:
linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)),
url('https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
}

.hero-content{
z-index:2;
}

.badge{
display:inline-block;
padding:6px 12px;
background:#dc2626;
border-radius:20px;
font-size:12px;
margin-bottom:10px;
}

.title{
font-size:50px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:18px;
opacity:0.85;
margin-bottom:25px;
}

/* BUTTONS */
.btn{
display:inline-block;
margin:6px;
padding:14px 22px;
border-radius:10px;
border:none;
cursor:pointer;
font-size:15px;
color:white;
background:linear-gradient(135deg,#dc2626,#7f1d1d);
transition:0.3s;
text-decoration:none;
box-shadow:0 8px 20px rgba(0,0,0,0.5);
}

.btn:hover{
transform:scale(1.08);
background:linear-gradient(135deg,#ef4444,#991b1b);
}

/* CONTAINER */
.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

/* CARDS */
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
border-radius:15px;
padding:25px;
margin-bottom:20px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:15px;
}

.box{
background:rgba(255,255,255,0.07);
padding:15px;
border-radius:12px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
}

/* FORM */
iframe{
width:100%;
height:850px;
border:none;
border-radius:12px;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
background:#02030a;
margin-top:30px;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

<div class="hero-content">

<div class="badge">TACTICAL SYSTEM ONLINE</div>

<div class="title">⚔️ المحارب المخضرم</div>

<div class="subtitle">
نظام تسجيل وإدارة عمليات بأسلوب احترافي
</div>

<a href="#register" class="btn">بدء التسجيل</a>

<!-- زر التلجرام -->
<a href="https://t.me/yourchannel" target="_blank" class="btn">
تواصل معنا 📢
</a>

<a href="#info" class="btn">معلومات النظام</a>

</div>

</section>

<!-- CONTENT -->
<div class="container">

<div class="card" id="register">
<h2>📋 استمارة التسجيل</h2>

<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe09873Fy1RAdO48UPyWjvMJ2R6r7mL8_NN7l3MK092sTnqvQ/viewform?embedded=true"></iframe>

</div>

<div class="card" id="info">
<h2>🛡️ نظام المنصة</h2>

<div class="grid">
<div class="box">تسجيل آمن</div>
<div class="box">إدارة طلبات</div>
<div class="box">واجهة احترافية</div>
<div class="box">استجابة سريعة</div>
</div>

</div>

</div>

<footer>
© 2026 المحارب المخضرم - جميع الحقوق محفوظة
</footer>

</body>
</html>

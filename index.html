<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحارب المخضرم</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

/* الخلفية */
.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.85)),
url('https://images.unsplash.com/photo-1549877452-9c387954fbc2?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}

.title{
font-size:42px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:18px;
opacity:0.8;
}

.buttons{
margin-top:25px;
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.btn{
padding:12px 20px;
background:#1d4ed8;
border:none;
color:white;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
background:#2563eb;
transform:scale(1.05);
}

/* المحتوى */
.container{
max-width:1000px;
margin:auto;
padding:40px 20px;
}

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
padding:20px;
border-radius:15px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,0.1);
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
outline:none;
}

.submit{
width:100%;
padding:14px;
background:#dc2626;
border:none;
color:white;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.submit:hover{
background:#ef4444;
}

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

.feature{
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:10px;
text-align:center;
}

footer{
text-align:center;
padding:20px;
background:#050814;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">

<div class="title">المحارب المخضرم لمستقبل مستحق</div>
<div class="subtitle">منصة تسجيل احترافية وإدارة طلبات بشكل منظم</div>

<div class="buttons">
<button class="btn">تسجيل جديد</button>
<button class="btn">الأسئلة الشائعة</button>
<button class="btn">تواصل معنا</button>
<button class="btn">حول المنصة</button>
<button class="btn">معلومات عامة</button>
</div>

</div>

<!-- CONTENT -->
<div class="container">

<div class="card">
<h2>استمارة التسجيل</h2>

<form>
<input type="text" placeholder="الاسم الكامل">
<input type="number" placeholder="العمر">
<input type="text" placeholder="رقم الهاتف">
<input type="text" placeholder="مكان الإقامة">

<label>رفع ملف</label>
<input type="file" accept="image/*,.pdf">

<textarea placeholder="ملاحظات"></textarea>

<button class="submit">إرسال الطلب</button>
</form>
</div>

<div class="card">
<h2>المميزات</h2>

<div class="features">
<div class="feature">تنظيم الطلبات</div>
<div class="feature">سهولة التسجيل</div>
<div class="feature">دعم مباشر</div>
<div class="feature">واجهة حديثة</div>
</div>

</div>

</div>

<footer>
جميع الحقوق محفوظة © 2026
</footer>

</body>
</html>

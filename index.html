<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الدب الروسي</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    header {
      background: #1e3a8a;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      padding: 30px;
    }

    input, textarea {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>
  الدب الروسي | البداية نحو المستقبل
</header>

<div class="container">
  <h2>استمارة تسجيل</h2>

  <form>
    <input type="text" placeholder="الاسم الكامل">
    <input type="number" placeholder="العمر">
    <input type="text" placeholder="رقم الهاتف">
    <textarea placeholder="ملاحظات"></textarea>
    <button type="button">إرسال</button>
  </form>

  <h3>فوائد التسجيل</h3>
  <p>الحصول على معلومات وخدمات ومتابعة مستمرة.</p>
</div>

<footer>
  مكتب البعد الآخر
</footer>

</body>
</html>

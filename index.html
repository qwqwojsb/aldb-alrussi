<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ المحارب المخضرم</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma, Arial;
}

/* BACKGROUND */
body{
color:white;
background:
linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.85)),
url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80');
background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* TOP BAR */
.topbar{
background:rgba(0,0,0,0.6);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
font-size:18px;
font-weight:bold;
}

.status{
color:#22c55e;
font-size:12px;
}

/* HERO */
.hero{
height:80vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.title{
font-size:50px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:16px;
opacity:0.85;
margin-bottom:20px;
}

/* BUTTONS */
.btn{
display:inline-block;
margin:6px;
padding:12px 18px;
border-radius:10px;
border:none;
cursor:pointer;
font-size:14px;
color:white;
background:linear-gradient(135deg,#dc2626,#7f1d1d);
transition:0.3s;
text-decoration:none;
box-shadow:0 8px 20px rgba(0,0,0,0.5);
}

.btn:hover{
transform:scale(1.06);
background:linear-gradient(135deg,#ef4444,#991b1b);
}

/* SECTIONS */
.container{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.card{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
border-radius:15px;
padding:20px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:15px;
}

.box{
background:rgba(255,255,255,0.07);
padding:15px;
border-radius:12px;
text-align:center;
}

/* FORM */
iframe{
width:100%;
height:800px;
border:none;
border-radius:12px;
}

/* FOOTER */
footer{
text-align:center;
padding:20px;
background:rgba(0,0,0,0.6);
margin-top:30px;
backdrop-filter:blur(10px);
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div class="logo">⚔️ المحارب المخضرم</div>
<div class="status">🟢 ONLINE</div>
</div>

<!-- HERO -->
<section class="hero">
<div>
<div class="title">نظام عسكري احترافي</div>
<div class="subtitle">منصة تسجيل وإدارة بأسلوب عمليات ميدانية</div>

<a href="#register" class="btn">بدء التسجيل</a>
<a href="https://t.me/ruuuseesuv" target="_blank" class="btn">تواصل معنا 📢</a>
<a href="#info" class="btn">معلومات</a>

</div>
</section>

<!-- CONTENT -->
<div class="container">

<!-- INFO -->
<div class="card" id="info">
<h2>🛡️ نظام المنصة</h2>

<div class="grid">
<div class="box">واجهة عسكرية</div>
<div class="box">تسجيل آمن</div>
<div class="box">إدارة بيانات</div>
<div class="box">أداء سريع</div>
</div>

</div>

<!-- FORM -->
<div class="card" id="register">
<h2>📋 استمارة التسجيل</h2>

<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe09873Fy1RAdO48UPyWjvMJ2R6r7mL8_NN7l3MK092sTnqvQ/viewform?embedded=true"></iframe>

</div>

</div>

<footer>
© 2026 نظام المحارب المخضرم
</footer>

</body>
</html>
